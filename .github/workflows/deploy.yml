name: Deploy UI (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop

    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ─── সাময়িক: সমস্যা ধরার জন্য, পরে মুছে দেবেন ───
      - name: Debug OIDC
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('SUB =',d['sub']);print('AUD =',d['aud'])" "$TOKEN"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $(terraform output -raw distribution_id) \
            --paths "/*"